name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Recherche de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Analyse de tout l'historique avec le programme gitleaks lui-même :
      # l'action officielle échoue sur le tout premier envoi d'un dépôt
      # (elle cherche le parent du premier commit, qui n'existe pas).
      - name: Installer gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar xz -C /usr/local/bin gitleaks
      - name: Chercher des secrets dans tout l'historique
        run: gitleaks git --redact --verbose --exit-code 1 .

  tests:
    name: Lint, typage, Vitest, Playwright
    runs-on: ubuntu-latest
    env:
      # Projet Supabase de DÉVELOPPEMENT uniquement (AD-27).
      SUPABASE_ENVIRONNEMENT: developpement
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.DEV_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.DEV_SUPABASE_SECRET_KEY }}
      SUPABASE_DB_URL: ${{ secrets.DEV_SUPABASE_DB_URL }}
      # Story 4.1 : liens d'invitation fabriqués vers le serveur lancé par Playwright.
      NEXT_PUBLIC_SITE_URL: http://localhost:3210
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typage
        run: npm run typecheck

      - name: Appliquer les migrations (dev)
        run: npm run db:push -- --yes

      - name: Vitest (règles et sécurité de la base)
        run: npm test

      - name: Navigateurs Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright (parcours et accessibilité)
        run: npm run test:e2e

      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7
